name: Build mobile APK (local, no EAS quota)

# Runs the actual Android build on GitHub's own runner via `eas build --local`
# instead of queuing it on Expo's cloud build servers — this never touches
# the EAS Free plan's 15 Android builds/month cap, since Expo's infrastructure
# isn't doing any compute here. Needs an EXPO_TOKEN repo secret (Expo
# dashboard → Account Settings → Access Tokens) so the CLI can pull the
# project's existing remote Android signing credentials.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to build"
        required: true
        default: both
        type: choice
        options:
          - customer
          - pro
          - admin
          - both
      profile:
        description: "EAS build profile (Android: preview=.apk, production=.aab. iOS: simulator=unsigned Simulator build, production=signed App Store .ipa)"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
          - simulator
      platform:
        description: "Platform"
        required: true
        default: android
        type: choice
        options:
          - android
          - ios

jobs:
  build:
    if: github.event.inputs.platform != 'ios'
    runs-on: ubuntu-latest
    # A hung Gradle daemon (see GRADLE_OPTS below) previously sat "in
    # progress" for 4+ hours instead of failing — cap it so a future hang
    # fails fast instead of silently burning CI minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: ${{ (github.event.inputs.app == 'both' && fromJSON('["customer","pro"]')) || fromJSON(format('["{0}"]', github.event.inputs.app)) }}
    defaults:
      run:
        working-directory: mobile/apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's ubuntu-latest image already ships the Android SDK
      # (ANDROID_HOME). android-actions/setup-android@v3 started failing on it
      # ("Failed to find package 'tools'"), so just accept the SDK licenses.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Install eas-cli
        if: matrix.app != 'admin'
        run: npm install -g eas-cli

      # preview builds an installable .apk (sideload-friendly); production
      # builds a Play Console-ready .aab (eas.json's android.buildType per
      # profile — see that file's comments). Computed once here so both the
      # build step's --output filename and the upload-artifact step below
      # agree on the extension.
      - name: Determine build output extension
        id: ext
        run: |
          if [ "${{ matrix.app }}" != "admin" ] && [ "${{ github.event.inputs.profile }}" = "production" ]; then
            echo "ext=aab" >> "$GITHUB_OUTPUT"
          else
            echo "ext=apk" >> "$GITHUB_OUTPUT"
          fi

      # customer/pro reuse the project's existing EAS-managed remote Android
      # signing keystore (needed for real Play Store / update continuity).
      # admin is an internal-only sideloaded tool with no EAS project
      # registered, so it skips EAS entirely and just does a plain Gradle
      # debug build (auto-signed with the runner's throwaway debug keystore).
      # Firebase config for Android push (FCM). Add repository secrets GOOGLE_SERVICES_PRO_B64 and
      # GOOGLE_SERVICES_CUSTOMER_B64 (the google-services.json files, base64-encoded). Without them the build still
      # succeeds, but the app cannot register for push notifications.
      - name: Write google-services.json from secret (FCM)
        if: matrix.app != 'admin'
        env:
          GS_PRO: ${{ secrets.GOOGLE_SERVICES_PRO_B64 }}
          GS_CUSTOMER: ${{ secrets.GOOGLE_SERVICES_CUSTOMER_B64 }}
        run: |
          if [ "${{ matrix.app }}" = "pro" ]; then secret="$GS_PRO"; else secret="$GS_CUSTOMER"; fi
          if [ -n "$secret" ]; then
            echo "$secret" | base64 -d > "$RUNNER_TEMP/google-services-${{ matrix.app }}.json"
            echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/google-services-${{ matrix.app }}.json" >> "$GITHUB_ENV"
            echo "google-services.json written for ${{ matrix.app }}"
          else
            echo "::warning::No Firebase secret for ${{ matrix.app }}: the app cannot receive push notifications."
          fi

      - name: Build APK/AAB locally (EAS, customer/pro)
        if: matrix.app != 'admin'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # The Kotlin/Gradle daemon ran out of Metaspace on the runner's
          # default JVM settings and got stuck retrying forever instead of
          # failing (that's what caused the earlier 4+ hour hang). Cap
          # heap/metaspace explicitly, turn off the daemon (nothing reuses
          # it in a one-shot CI build anyway) and disable parallelism so
          # there's only ever one JVM competing for the runner's ~7GB RAM.
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m"
            -Dorg.gradle.daemon=false
            -Dorg.gradle.parallel=false
            -Dorg.gradle.workers.max=1
        run: eas build --local --platform android --profile ${{ github.event.inputs.profile }} --non-interactive --output ./build-${{ matrix.app }}.${{ steps.ext.outputs.ext }}

      - name: Prebuild native Android project (admin)
        if: matrix.app == 'admin'
        # customer/pro get this from eas.json's build-profile "env" block,
        # which only applies inside `eas build`. The admin build bypasses
        # EAS entirely (plain Gradle build), so it must be set explicitly
        # here or the app would silently bake in the localhost:3000 fallback.
        env:
          EXPO_PUBLIC_API_URL: https://www.servigic.com
        run: npx expo prebuild --platform android --non-interactive

      - name: Build APK locally (Gradle release, admin)
        if: matrix.app == 'admin'
        env:
          EXPO_PUBLIC_API_URL: https://www.servigic.com
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m"
            -Dorg.gradle.daemon=false
            -Dorg.gradle.parallel=false
            -Dorg.gradle.workers.max=1
        run: |
          cd android
          chmod +x gradlew
          # RELEASE variant: it embeds the JavaScript bundle. (A debug build does not - it tries to reach a Metro dev
          # server and shows "Unable to load script" on a phone.) The Expo template signs release with the debug key,
          # so the APK still installs directly.
          ./gradlew assembleRelease -x lintVitalRelease
          cp app/build/outputs/apk/release/app-release.apk ../build-admin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: servigic-${{ matrix.app }}-${{ github.event.inputs.profile }}.${{ steps.ext.outputs.ext }}
          path: mobile/apps/${{ matrix.app }}/build-${{ matrix.app }}.${{ steps.ext.outputs.ext }}
          retention-days: 30

  # iOS: runs on GitHub's macOS runners via `eas build --local`. The "simulator"
  # profile needs no Apple account and produces an unsigned .app for the iOS
  # Simulator (a Mac). The "production" profile produces a signed App Store
  # .ipa and needs Apple credentials set up once in EAS (`eas credentials`).
  build-ios:
    if: github.event.inputs.platform == 'ios'
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: ${{ (github.event.inputs.app == 'both' && fromJSON('["customer","pro"]')) || fromJSON(format('["{0}"]', github.event.inputs.app)) }}
    defaults:
      run:
        working-directory: mobile/apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install eas-cli
        run: npm install -g eas-cli

      - name: Determine build output extension
        id: ext
        run: |
          if [ "${{ github.event.inputs.profile }}" = "simulator" ]; then
            echo "ext=tar.gz" >> "$GITHUB_OUTPUT"
          else
            echo "ext=ipa" >> "$GITHUB_OUTPUT"
          fi

      - name: Build iOS locally (EAS)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --local --platform ios --profile ${{ github.event.inputs.profile }} --non-interactive --output ./build-${{ matrix.app }}-ios.${{ steps.ext.outputs.ext }}

      - uses: actions/upload-artifact@v4
        with:
          name: servigic-${{ matrix.app }}-ios-${{ github.event.inputs.profile }}.${{ steps.ext.outputs.ext }}
          path: mobile/apps/${{ matrix.app }}/build-${{ matrix.app }}-ios.${{ steps.ext.outputs.ext }}
          retention-days: 30
